[dlss5]
; ============================================================================
;  Football Life 2026 / PES 2021  --  taratura consigliata / recommended tuning
;  Misurata su Radeon RX 9070 XT a 2560x1440.
;  Measured on a Radeon RX 9070 XT at 2560x1440.
;
;  Copia questo file nella cartella del gioco (quella con FL_2026.exe o PES2021.exe).
;  Copy this file into the game folder (the one with FL_2026.exe or PES2021.exe).
; ============================================================================

; --- avvio / startup --------------------------------------------------------
; 0 = l'effetto parte spento, si accende con Ctrl+Fine (consigliato: vedi
;     subito la differenza premendo il tasto).
; 0 = the effect starts off, switch it on with Ctrl+End (recommended: you can
;     A/B the difference with one key).
; Metti 1 se vuoi che sia gia' acceso all'avvio / set 1 to start with it on.
StartOn=0

; --- scorciatoia / hotkey ---------------------------------------------------
; 35 = tasto Fine (End). ToggleMods: 1 Ctrl + 2 Alt + 4 Shift. Quindi Ctrl+Fine.
; 35 = End key. ToggleMods: 1 Ctrl + 2 Alt + 4 Shift. So this is Ctrl+End.
ToggleKey=35
ToggleMods=1
DisableOnAltTab=0

; --- LA VOCE CHE CONTA / THE SETTING THAT MATTERS ---------------------------
; Scale = risoluzione della rete rispetto allo schermo.
; Scale = the resolution the network runs at, relative to your screen.
;
;   Misurati a schermo / measured on screen (RX 9070 XT, 2560x1440, nei menu):
;     effetto spento / effect off      499 fps
;     Scale=1.00  (rete a 2560x1440)    20 fps
;     Scale=0.96                        31 fps
;     Scale=0.76  (rete a 1946x1094)    19 fps
;   Scale=0.60 non e' stato misurato a schermo: dovrebbe costare meno di tutti,
;   ma aspettati comunque un calo enorme rispetto ai 499 fps senza effetto.
;   Scale=0.60 has not been measured on screen: it should be the cheapest, but
;   still expect a huge drop compared to the 499 fps without the effect.
;
; Se hai una scheda piu' lenta di una RX 9070 XT, abbassala ancora (0.50).
; On a card slower than an RX 9070 XT, lower it further (0.50).
Scale=0.60

; Passes: lasciare 1. A 2 il costo raddoppia e si torna sotto i 30 fps.
; Passes: leave at 1. At 2 the cost doubles and you drop below 30 fps again.
Passes=1

; 0 = sRGB, giusto per un gioco SDR come PES / correct for an SDR game like PES.
Encoding=0
; 0 = English, 1 = Portugues do Brasil (lingua del pannello / panel language).
Language=0

; --- tutto il resto ai valori di default ------------------------------------
; --- everything else at default values --------------------------------------
; Non toccare questi valori se non sai cosa fanno. Nel pannello, i controlli
; segnati in ROSSO possono far crashare il driver video.
; Do not change these unless you know what they do. In the panel, the controls
; marked RED can crash the display driver.
Intensity=1
AutoMask=1
ToneChannels=0
EngineScale=0.03125
Tonemap=-1
Temporal=0
ResidualLimit=0.25
EdgeFade=0
Guard=2
ColourStrength=1
GuardPerPass=0
PassTaper=0
Structure=1
Skin=1
Tone=1
Pass1Override=0
Pass1Structure=1
Pass1Tone=1
Pass1Skin=1
Pass2Override=0
Pass2Structure=1
Pass2Tone=1
Pass2Skin=1
Pass3Override=0
Pass3Structure=1
Pass3Tone=1
Pass3Skin=1
FlowGate=0.02
FlowRatio=0.7
DiffuseWhite=100
DebugView=0
MotionScale=1
Inline=1
Bicubic=1
NetworkOutput=0
Motion=1
History=1
Depth=1
GameGuides=1
