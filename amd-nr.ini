[amd-nr]
; ============================================================================
;  Football Life 2026 / PES 2021  --  taratura consigliata / recommended tuning
;  Misurata su Radeon RX 9070 XT a 2560x1440.
;  Measured on a Radeon RX 9070 XT at 2560x1440.
;
;  Copia questo file nella cartella del gioco (quella con FL_2026.exe o PES2021.exe).
;  Copy this file into the game folder (the one with FL_2026.exe or PES2021.exe).
;
;  Qui ci sono SOLO le voci scelte per Football Life. Tutto il resto l'add-on
;  lo tiene ai suoi valori di default e li aggiunge qui da solo appena tocchi
;  un controllo nel pannello.
;  Only the settings chosen for Football Life are here. The add-on keeps
;  everything else at its own defaults and adds them here by itself as soon as
;  you touch a control in the panel.
; ============================================================================

; --- avvio / startup --------------------------------------------------------
; 0 = l'effetto parte spento, si accende con Ctrl+Fine (consigliato: vedi
;     subito la differenza premendo il tasto).
; 0 = the effect starts off, switch it on with Ctrl+End (recommended: you can
;     A/B the difference with one key).
; Metti 1 se vuoi che sia gia' acceso all'avvio / set 1 to start with it on.
StartOn=0

; --- scorciatoia / hotkey ---------------------------------------------------
; 35 = tasto Fine (End). ToggleMods: 1 Ctrl + 2 Alt + 4 Shift. Quindi Ctrl+Fine.
; 35 = End key. ToggleMods: 1 Ctrl + 2 Alt + 4 Shift. So this is Ctrl+End.
ToggleKey=35
ToggleMods=1
DisableOnAltTab=0

; --- LA VOCE CHE CONTA / THE SETTING THAT MATTERS ---------------------------
; Scale = risoluzione della rete rispetto allo schermo.
; Scale = the resolution the network runs at, relative to your screen.
;
; 0.50 e' il valore con cui gioco io su una RX 9070 XT: e' il compromesso che
; ho trovato migliore. Se vuoi un filo piu' di dettaglio fine prova 0.60.
; 0.50 is what I play with on an RX 9070 XT: the best compromise I found. For a
; touch more fine detail, try 0.60.
Scale=0.50

; Passes: lasciare 1. A 2 il costo raddoppia.
; Passes: leave at 1. At 2 the cost doubles.
Passes=1

; 0 = sRGB, giusto per un gioco SDR come PES / correct for an SDR game like PES.
Encoding=0
; 0 = English, 1 = Portugues do Brasil (lingua del pannello / panel language).
Language=0
